# Secret scan of every push and pull request (the last line of defence when the pre-commit hook is not enabled or
# was bypassed). Scans only the new commits, with the rules of .gitleaks.toml. See docs/SECRETS.md.
name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commits to scan
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "opts=$PR_BASE..$SHA" >> "$GITHUB_OUTPUT"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            # new branch: the commits that are not on main yet
            base=$(git merge-base "$SHA" origin/main 2>/dev/null || true)
            if [ -n "$base" ] && [ "$base" != "$SHA" ]; then echo "opts=$base..$SHA" >> "$GITHUB_OUTPUT"; else echo "opts=-1 $SHA" >> "$GITHUB_OUTPUT"; fi
          else
            echo "opts=$BEFORE..$SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: gitleaks
        env:
          LOG_OPTS: ${{ steps.range.outputs.opts }}
        run: |
          # the checkout belongs to the runner user, not the container one: trust it for git
          docker run --rm -v "$PWD:/repo" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="*" \
            zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner -v \
            --log-opts="$LOG_OPTS"
