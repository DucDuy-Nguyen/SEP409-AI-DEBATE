# PostgreSQL cho dev + test cua AI Generation service.
# Port host 5433 (khong phai 5432) de khong dung Postgres khac tren may.
services:
  postgres:
    image: postgres:16-alpine
    container_name: adpp-ai-generation-postgres
    environment:
      POSTGRES_USER: adpp
      POSTGRES_PASSWORD: adpp
      POSTGRES_DB: ai_generation
    ports:
      - "5433:5432"
    volumes:
      - ai_generation_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adpp -d ai_generation"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ai_generation_pgdata:
